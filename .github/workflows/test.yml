name: Unit tests

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup composer
                uses: php-actions/composer@v6
                with:
                    php_version: 8.4

            -   name: Run PHPUnit Tests
                uses: php-actions/phpunit@v4
                with:
                    args: --testdox tests
                    php_version: "8.4"

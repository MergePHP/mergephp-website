name: Tests

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2

            -   name: Install PHP dependencies
                run: composer install

            -   name: Run PHPUnit Tests
                run: composer test

            -   name: Smoke test
                run: composer build

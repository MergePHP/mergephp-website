name: Send Discord message
description: Posts a message to a Discord webhook without ever printing the webhook URL or Discord's response

inputs:
    webhook-url:
        description: 'The Discord webhook URL (a secret)'
        required: true
    payload:
        description: 'The JSON message payload'
        required: true
    file:
        description: 'Optional path to a file to attach; the payload references it as attachment://<file name>'
        required: false
        default: ''

runs:
    using: composite
    steps:
        -   name: Send message
            shell: bash
            env:
                WEBHOOK_URL: ${{ inputs.webhook-url }}
                PAYLOAD: ${{ inputs.payload }}
                FILE: ${{ inputs.file }}
            run: |
                if [ -n "$FILE" ]; then
                    body=(--form-string "payload_json=${PAYLOAD}" --form "files[0]=@${FILE}")
                else
                    body=(-H "Content-Type: application/json" -d "$PAYLOAD")
                fi
                status=$(printf 'url = "%s?with_components=true"\n' "$WEBHOOK_URL" | curl \
                    --silent \
                    --output /dev/null \
                    --write-out '%{http_code}' \
                    --config - \
                    -X POST \
                    "${body[@]}" || true)
                if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
                    echo "::error::Discord message failed (HTTP ${status:-unknown})"
                    exit 1
                fi

name: Set up PHP
description: Installs the PHP minor version that composer.json requires, so the version is declared in only one place

runs:
    using: composite
    steps:
        -   name: Read the PHP version from composer.json
            id: version
            shell: bash
            run: |
                version=$(jq -r '.require.php' composer.json | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
                echo "php=${version}" >> "$GITHUB_OUTPUT"

        -   name: Setup PHP
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ steps.version.outputs.php }}
